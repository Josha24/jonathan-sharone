<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jonathan & Sharone</title>

  <link rel="stylesheet" href="style.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<!-- LOADING SCREEN -->
<div id="loader">
  <div class="loader-content">
    <div class="ring"></div>
    <p>Jonathan & Sharone</p>
  </div>
</div>

<!-- FLOATING PARTICLES -->
<div class="particles"></div>

<!-- MAIN CONTENT -->
<div id="main">

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="overlay"></div>

    <div class="hero-content">
      <h1>Jonathan & Sharone</h1>
      <p class="date">Nous nous marions</p>
      <p class="subdate">14 Juin 2026</p>

      <button id="openInvite">Ouvrir l’invitation ✉️</button>
    </div>
  </section>

  <!-- ENVELOPE SECTION -->
  <section id="envelopeSection" class="hidden">
    <div class="envelope-container">
      <div class="envelope" id="envelope">
        <div class="front"></div>
        <div class="back"></div>
      </div>
      <p class="tap">Cliquez pour ouvrir</p>
    </div>
  </section>

  <!-- INVITATION CONTENT -->
  <section id="invitation" class="hidden">

    <!-- PHOTO -->
    <div class="photo-section">
      <img src="photo.jpg" alt="Couple Photo">
    </div>

    <!-- VERSE -->
    <div class="verse">
      <h2>Marc 10:9</h2>
      <p>« Que l'homme donc ne sépare pas ce que Dieu a uni. »</p>
    </div>

    <!-- DETAILS -->
    <div class="details">

      <div class="card">
        <h3>Cérémonie</h3>
        <p>The Address Boutique Hotel<br>Port Chambly</p>
      </div>

      <div class="card">
        <h3>Date</h3>
        <p>14 Juin 2026</p>
      </div>

      <div class="card">
        <h3>Heure</h3>
        <p>17:00</p>
      </div>

    </div>

    <!-- COUNTDOWN -->
    <div class="countdown">
      <h2>Compte à rebours</h2>
      <div id="timer">
        <div><span id="days">0</span>J</div>
        <div><span id="hours">0</span>H</div>
        <div><span id="minutes">0</span>M</div>
        <div><span id="seconds">0</span>S</div>
      </div>
    </div>

    <!-- GALLERY -->
    <div class="gallery">
      <img src="img1.jpg">
      <img src="img2.jpg">
      <img src="img3.jpg">
    </div>

  </section>

  <!-- AUDIO -->
  <audio id="music" src="music.mp3"></audio>

</div>

<script src="script.js"></script>
</body>
</html>
